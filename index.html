<!DOCTYPE html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>City Cell ERP PRO</title><meta name='theme-color' content='#0057ff'><style>body{margin:0;font-family:-apple-system;background:#050816;color:#fff}header{padding:28px;background:linear-gradient(135deg,#0057ff,#07111f)}.logo{background:#fff;color:#000;border-radius:18px;padding:18px;font-weight:900;text-align:center}.card{background:#111827;margin:16px;border-radius:18px;padding:16px}input,button{width:100%;padding:14px;border-radius:12px;border:none;margin-top:10px}button{background:#2563eb;color:#fff;font-weight:700}</style></head><body><header><div class='logo'><div style='font-size:36px'>CITY CELL</div><div style='font-size:11px;letter-spacing:4px'>O MELHOR ESTÁ AQUI</div></div><h2>City Cell ERP PRO</h2><p>Antonio Vicente</p></header><div class='card'><h3>Precificador</h3><input id='custo' type='number' placeholder='Quanto pagou?'><button onclick='calc()'>Calcular</button><p id='r'></p></div><script>function br(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function calc(){let c=Number(custo.value);if(!c)return;let p=c*2.72;r.innerHTML='PIX: <b>'+br(p)+'</b><br>Débito: <b>'+br(p/0.9863)+'</b><br>1x: <b>'+br(p/0.9685)+'</b>';}</script></body></html>
